{% extends "base.html" %}

{% block title %}Advanced search &mdash; pkgbot{% endblock %}

{% block content %}
<h1>Search</h1>
{% if repo is defined %}
<form class="card advanced-search" data-search-form method="get" action="{{ consts.root_url | safe }}/repos/{{ repo.slug }}">
  <div data-field>
    <label for="advanced-repo">Repository</label>
    <select id="advanced-repo" data-search-repo>
      {%- for r in repos %}
      <option value="{{ r.slug }}"{% if r.slug == repo.slug %} selected{% endif %}>{{ r.name }}</option>
      {%- endfor %}
    </select>
  </div>

  <label for="advanced-q">Search query</label>
  <fieldset class="group">
    <input type="search" id="advanced-q" data-search-query name="{{ scope }}" value="{{ term }}" placeholder="Search keywords, eg: vim"
      autocomplete="off" />
      <select id="advanced-scope" data-search-scope style="max-width: 30%" aria-label="Search fields">
        <option value="q"{% if scope == "q" %} selected{% endif %}>Name and description</option>
        <option value="name"{% if scope == "name" %} selected{% endif %}>Name only</option>
      </select>
  </fieldset>

  <label data-field>
    Maintainer
    <input type="text" name="maintainer" value="{{ q.maintainer }}" placeholder="eg: alice" />
    <small data-hint>The maintainer's handle in the repo.</small>
  </label>

  <label data-field>
    Tag
    <input type="text" name="tag" value="{{ q.tag }}" placeholder="eg: editor" />
  </label>

  <label for="is_nonfree">License</label>
  <fieldset class="group">
    <input type="text" name="license" value="{{ q.license }}" placeholder="eg: MIT" data-autocomp="licenses" />
    <select id="is_nonfree" name="is_nonfree" style="max-width: 30%" aria-label="License type">
      {%- for v in ["", "false", "true"] %}
      <option value="{{ v }}"{% if v == q.is_nonfree or (v == "true" and q.is_nonfree == "1") or (v == "false" and q.is_nonfree == "0") %} selected{% endif %}>
        {%- if v == "true" %}Non-free{% elif v == "false" %}Free{% else %}Any{% endif -%}
      </option>
      {%- endfor %}
    </select>
  </fieldset>

  <label data-field>
    Group
    <input type="text" name="group" value="{{ q.group }}" placeholder="eg: gnome" />
  </label>

  <label data-field>
    Platform
    <input type="text" name="platform" value="{{ q.platform }}" placeholder="eg: x86_64" data-autocomp="platforms" />
  </label>

  <div data-field>
    <label for="status">Status</label>
    <select id="status" name="status">
      {%- for s in ["", "unprocessed", "newest", "outdated", "ignored", "unique", "devel", "legacy", "incorrect", "untrusted", "noscheme", "rolling"] %}
      <option value="{{ s }}"{% if s == q.status %} selected{% endif %}>{% if s %}{{ s | capitalize }}{% else %}Any{% endif %}</option>
      {%- endfor %}
    </select>
  </div>


  <div data-field>
    <label for="per_page">Per page</label>
    <select id="per_page" name="per_page">
      {%- for n in [10, 20, 50] %}
      <option value="{{ n }}"{% if n == q.per_page %} selected{% endif %}>{{ n }}</option>
      {%- endfor %}
    </select>
  </div>

  <div class="hstack">
    <button type="submit">Search</button>
    <input type="reset" class="button outline" value="Clear" />
  </div>
</form>
{% else %}
<p>No repositories available.</p>
{% endif %}
{% endblock %}
