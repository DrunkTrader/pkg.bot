x-db-credentials: &db-credentials                             # Use the default POSTGRES_ credentials if they're available or simply default to "repology"
  POSTGRES_USER: &db-user repology                            # for database user, password, and database name
  POSTGRES_PASSWORD: &db-password repology
  POSTGRES_DB: &db-name repology

services:
  # Postgres database
  db:
    build: .
    image: pkgbot-postgres:17
    container_name: repology_db
    restart: unless-stopped
    # lul ^_^
    cpus: 2.0
    mem_limit: 1536m
    shm_size: 256m
    command:
      - postgres
      - -c
      - shared_buffers=384MB
      - -c
      - effective_cache_size=1GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - autovacuum_work_mem=64MB
      - -c
      - autovacuum_max_workers=1
      - -c
      - max_connections=20
      - -c
      - max_parallel_workers_per_gather=0
      - -c
      - max_parallel_maintenance_workers=1
      - -c
      - max_parallel_workers=2
      - -c
      - max_wal_size=4GB
      - -c
      - checkpoint_timeout=15min
    ports:
      - "127.0.0.1:55432:5432"
    networks:
      - repology
    environment:
      <<: *db-credentials
      # Match the importer's passwordless default; keep the host port on loopback.
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repology"]
      interval: 10s
      timeout: 5s
      retries: 6
    volumes:
      - type: volume
        source: repology-data
        target: /var/lib/postgresql/data

networks:
  repology:

volumes:
  repology-data:
