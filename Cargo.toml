[package]
name = "pkgbot"
description = "Super fast search engine for Linux distro packages."
homepage = "https://pkg.bot"
repository = "https://github.com/knadh/pkg.bot"
license = "AGPL-3.0"
authors = ["Kailash Nadh <kailash@nadh.in>"]

version = "0.1.0"
rust-version = "1.91"
edition = "2021"

[dependencies]
axum = "0.8"
axum-extra = { version = "0.10", features = ["query"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["sqlite", "postgres", "runtime-tokio", "tls-rustls"] }
clap = { version = "4", features = ["derive"] }
toml = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
chrono = "0.4"
tera = "1"
mime_guess = "2"
yesqlr = "0.1.1"
yesqlr_macros = "0.2"
log = "0.4"
env_logger = "0.11"
thiserror = "2"
quick-xml = "0.42.0"
urlencoding = "2.1.3"

# Use mimalloc for musl builds (musl's default malloc is very slow).
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { version = "0.1", default-features = false }

[profile.release]
strip = true
lto = true
opt-level = 3
codegen-units = 1
